name: Data and export checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: python -m pip install -r requirements-data.txt
      - run: python -m unittest -v test_pipeline test_fixed_candidate test_diffusion_constraints test_followup_case test_xyz_inputs test_candidate_quality
      - run: python prepare_fragments.py --source-dir examples/table_inputs --source-map examples/table_inputs/sources.json --output-dir runs/demo
      - run: python verify_outputs.py --data-dir runs/demo
